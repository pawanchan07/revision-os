<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#080912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Revision OS</title>
<meta name="description" content="One concept a day, tested, connected and brought back before you forget it.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script>try { var t = localStorage.getItem('revos:theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span>REVISION OS</a>
  <nav class="nav" aria-label="Main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13h6l-1 8 9-11h-6z"/></svg><span>Today</span></a>
    <a href="#/path" data-tab="path"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.2 17.2c5 -1 2 -9 7.600 -10.300"/></svg><span>Worlds</span></a>
    <a href="#/map" data-tab="map"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="8" r="2.3"/><circle cx="12" cy="17.5" r="2.3"/><path d="M8 7.6 15.8 7.8M7.2 9l3.6 6.6M16.8 10l-3.500 5.600"/></svg><span>Map</span></a>
    <a href="#/hack" data-tab="hack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8l4 4-4 4M12 17h7"/></svg><span>Hacker</span></a>
    <a href="#/you" data-tab="you"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.500" r="3.600"/><path d="M5 20c.8-3.600 3.600-5.400 7-5.400s6.200 1.800 7 5.400"/></svg><span>You</span></a>
  </nav>
  <div class="top-right">
    <div class="hud" id="hud"></div>
    <button class="palbtn" id="pal-btn" aria-label="Search or run a command"><span>Search or run a command</span><kbd>Ctrl K</kbd></button>
  </div>
</header>
<main id="main" tabindex="-1"><p class="boot">STARTING UP</p></main>
<div class="pal" id="pal" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="pal-box"><input id="pal-in" type="text" placeholder="Search, or try: before transformers" autocomplete="off" spellcheck="false" aria-label="Search or run a command"><div class="pal-list" id="pal-list"></div>
  <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:24px">Revision OS needs JavaScript turned on.</p></noscript>
<script src="core.js"></script>
<script src="visuals.js"></script>
<script src="challenges.js"></script>
<script src="deep.js"></script>
<script src="notify.js"></script>
<script src="app.js"></script>
</body>
</html>
