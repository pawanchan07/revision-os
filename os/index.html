<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Revision OS</title>
<meta name="description" content="A personal learning system: one concept a day, tested, connected and brought back before you forget it.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem('revos:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><span class="logo-mark" aria-hidden="true"></span>REVISION OS</a>
  <nav class="nav" aria-label="Main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg><span>Today</span></a>
    <a href="#/map" data-tab="map"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="8" r="2.3"/><circle cx="12" cy="17.5" r="2.3"/><path d="M8 7.6 15.8 7.8M7.2 9l3.6 6.6M16.8 10l-3.5 5.6"/></svg><span>Map</span></a>
    <a href="#/path" data-tab="path"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span>Path</span></a>
    <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><span>Progress</span></a>
    <a href="#/hack" data-tab="hack"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8l4 4-4 4M12 17h7"/></svg><span>Hacker</span></a>
  </nav>
  <div class="top-right">
    <div class="hud" id="hud"></div>
    <button class="palbtn" id="pal-btn" aria-label="Open the command palette"><span>Search or run a command</span><kbd>Ctrl K</kbd></button>
    <button class="iconbtn" id="theme-btn" aria-label="Switch between light and dark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
  </div>
</header>
<main id="main" tabindex="-1"><p class="boot">Starting up…</p></main>
<div class="pal" id="pal" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="pal-box"><input id="pal-in" type="text" placeholder="Search concepts, or try: before transformers" autocomplete="off" spellcheck="false" aria-label="Search or run a command"><div class="pal-list" id="pal-list"></div>
  <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:24px">Revision OS needs JavaScript turned on.</p></noscript>
<script src="core.js"></script>
<script src="visuals.js"></script>
<script src="challenges.js"></script>
<script src="views.js"></script>
</body>
</html>
